<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supplier Risk AI · PepsiCo India</title>
  <meta name="description" content="AI-powered early warning system that flags supplier distress 3-9 months before it hurts production." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236c8cff'/><text x='32' y='42' font-family='Inter,sans-serif' font-weight='800' font-size='28' fill='%230b1020' text-anchor='middle'>SR</text></svg>" />
</head>
<body>
  <div id="root">
    <div style="padding:40px;color:#9aa3c7;font-family:Inter,sans-serif">Loading Supplier Risk AI…</div>
  </div>
  <noscript><div style="padding:40px;color:#9aa3c7;font-family:sans-serif">This dashboard requires JavaScript to run.</div></noscript>
  <script>
    // Apply persisted theme before React mounts to avoid a flash of the wrong theme.
    try { var t = JSON.parse(localStorage.getItem("srisk.theme")); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react" src="assets/app.js"></script>
</body>
</html>
